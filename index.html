<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Práctica 1.5 | Personalización de escenarios</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/styles.css">

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <!-- =====================================================
         ESCENARIO THREE.JS
    ====================================================== -->

    <div id="scene-container"></div>


    <!-- =====================================================
         OSCURECIMIENTO CINEMATOGRÁFICO
    ====================================================== -->

    <div class="screen-overlay"></div>


    <!-- =====================================================
         HUD SUPERIOR
    ====================================================== -->

    <section class="hud">

        <div class="hud-header">

            <div class="hud-symbol">
                ◆
            </div>

            <div>
                <span class="hud-label">
                    PRÁCTICA 1.5
                </span>

                <h1>
                    Personalización de escenarios
                </h1>
            </div>

        </div>


        <div class="hud-divider"></div>


        <div class="controls">

            <div class="control-item">
                <kbd>WASD</kbd>

                <span>
                    Movimiento
                </span>
            </div>


            <div class="control-item">
                <kbd>SHIFT</kbd>

                <span>
                    Correr
                </span>
            </div>


            <div class="control-item">
                <kbd>F</kbd>

                <span>
                    Lanzar
                </span>
            </div>


            <div class="control-item">
                <kbd>MOUSE</kbd>

                <span>
                    Cámara
                </span>
            </div>

        </div>

    </section>


    <!-- =====================================================
         ESTADO DEL ESCENARIO
    ====================================================== -->

    <div class="scene-status">

        <span class="status-dot"></span>

        <span>
            ESCENARIO ACTIVO
        </span>

    </div>


    <!-- =====================================================
         DECORACIÓN CENTRAL
    ====================================================== -->

    <div class="center-marker">
        <span></span>
    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="app-footer">

        <div class="footer-line"></div>

        <div class="footer-content">

            <span class="footer-name">
                Alicia Yamileth Mariano Reséndiz
            </span>

            <span class="footer-separator">
                •
            </span>

            <span>
                No. de control: 22200787
            </span>

            <span class="footer-separator">
                •
            </span>

            <span>
                Desarrollo de soluciones en ambientes virtuales
            </span>

        </div>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="./assets/js/main.js"
    ></script>

</body>

</html>
